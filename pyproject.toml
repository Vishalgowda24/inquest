[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inquest-incident-investigator"
version = "0.1.0"
description = "Deterministic synthetic incident telemetry and evidence-driven investigation"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2,<3", "networkx>=3", "numpy>=1.26", "pandas>=2", "scipy>=1.12", "typer>=0.12", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sim = "simulator.cli:main"
inquest = "inquest.cli:main"

[tool.setuptools.packages.find]
include = ["simulator*", "inquest*"]

[tool.pytest.ini_options]
testpaths = ["simulator/tests", "inquest/tests", "tests_api"]
python_files = ["test_*.py"]

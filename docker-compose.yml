version: '3.8'

services:
  inquest-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inquest-demo
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEMO_BASIC_AUTH_USERNAME=${DEMO_BASIC_AUTH_USERNAME:-}
      - DEMO_BASIC_AUTH_PASSWORD=${DEMO_BASIC_AUTH_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
